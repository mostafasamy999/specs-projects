# In the open Requests filter sheet, sets one date field by typing it.
# The fields (DateField) open Flutter's Material date picker; its pencil
# ("Switch to input") turns it into a text box that takes mm/dd/yyyy, which
# avoids paging through months. The box gets focus with the cursor at the
# end, so eraseText clears it without a tap.
# Params (runFlow env; no env: header here, it would override them):
#   SECTION  "REQUESTED DATE" | "CREATE DATE"  (the sheet's upper-case labels)
#   FIELD    "START DATE" | "END DATE"
#   VALUE    "11/20/2026"
# The field shows the value back as d/M/yyyy, e.g. "20/11/2026".
# synced: 2026-11-05 (app c1aae2e3)
appId: ${APP_ID}
---
- scrollUntilVisible:
    element:
      text: ${SECTION}
    direction: DOWN
    timeout: 10000
    centerElement: true
# The nearest field of that name under the section label: the requested and
# created rows both have a START DATE and an END DATE.
- tapOn:
    text: "(?s)${FIELD}.*"
    below:
      text: ${SECTION}
- extendedWaitUntil:
    visible: "Switch to input"
    timeout: 10000
- tapOn: "Switch to input"
- waitForAnimationToEnd
- eraseText: 20
- inputText: ${VALUE}
- tapOn: "OK"
- waitForAnimationToEnd
