# Launches the app (keeping the session), logs in if needed and opens the
# Activities dashboard.
# synced: CL-10
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
- runFlow: dismiss_system_dialogs.yaml
- runFlow: login.yaml
- runFlow: dismiss_system_dialogs.yaml
- extendedWaitUntil:
    visible:
      id: "bottom_nav_activities_tab"
    timeout: 90000
- tapOn:
    id: "bottom_nav_activities_tab"
- extendedWaitUntil:
    visible:
      id: "activities_dashboard_total"
    # First load chains ~10 lookups behind the home screen's calls; the test
    # server can take minutes on a cold start.
    timeout: 180000
