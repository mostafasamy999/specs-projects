# Launches the app (keeping the session), logs in if needed and opens the
# Activities dashboard.
# synced: CL-10
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
# A launch right after the stop can be dropped while Android is still killing
# the old process; if neither login nor home shows, launch once more.
- extendedWaitUntil:
    visible:
      id: "login_email_field|bottom_nav_activities_tab"
    timeout: 60000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "login_email_field|bottom_nav_activities_tab"
    commands:
      - launchApp:
          stopApp: false
- runFlow: dismiss_system_dialogs.yaml
- runFlow: login.yaml
- runFlow: dismiss_system_dialogs.yaml
- extendedWaitUntil:
    visible:
      id: "bottom_nav_activities_tab"
    timeout: 90000
- tapOn:
    id: "bottom_nav_activities_tab"
- extendedWaitUntil:
    visible:
      id: "activities_dashboard_total"
    # First load chains ~10 lookups behind the home screen's calls; the test
    # server can take minutes on a cold start.
    timeout: 180000
    optional: true
# Debug builds can bring up Chucker (the HTTP inspector) over the app; leave
# it and open Activities again.
- runFlow:
    when:
      visible: "Copy cURL Command|Chucker.*"
    commands:
      - repeat:
          while:
            notVisible:
              id: "bottom_nav_activities_tab"
          times: 3
          commands:
            - back
      - tapOn:
          id: "bottom_nav_activities_tab"
      - extendedWaitUntil:
          visible:
            id: "activities_dashboard_total"
          timeout: 180000
- assertVisible:
    id: "activities_dashboard_total"
