# QF-01 — Visits chip shows only Visits (P0)
# Req: BR §6.1. Expected: every card is a Visit. (The request typeId=2 is
# checked from the app log, not here.)
appId: ${APP_ID}
tags: [QF-01, P0, smoke, quick_filters]
---
- runFlow: ../../subflows/open_list.yaml
- runFlow:
    file: ../../subflows/select_type.yaml
    env:
      TYPE: visit
- assertVisible:
    id: "activities_chip_type"
    selected: true
- assertNotVisible: "TASK"
