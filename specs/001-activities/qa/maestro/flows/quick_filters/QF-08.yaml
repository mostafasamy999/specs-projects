# QF-08 — Scope My activities (P1)
# Req: API §1.7, T5.3, G-01. UI part only: the chip shows My Activity and the
# list reloads. The request IDs (own vs allowed) are checked from the app log.
appId: ${APP_ID}
tags: [QF-08, P1, quick_filters, scope]
---
- runFlow: ../../subflows/open_list.yaml
- runFlow:
    file: ../../subflows/select_scope.yaml
    env:
      SCOPE: myActivities
- assertVisible:
    id: "activities_chip_scope"
    selected: true
- assertVisible: "Scope · My Activity"
