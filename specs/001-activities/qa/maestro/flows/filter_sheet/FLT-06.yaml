# FLT-06 — Visit-only filters are hidden when the type is All (P1)
# Req: BR §6.2. Whether earlier values are cleared is G-21 (not checked).
appId: ${APP_ID}
tags: [FLT-06, P1, filter_sheet]
env:
  CATEGORY_LABEL: Category
---
- runFlow: ../../subflows/open_list.yaml
- tapOn:
    id: "activities_filter_button"
- extendedWaitUntil:
    visible:
      id: "activities_filter_apply"
    timeout: 10000
- tapOn: "Visit"
- assertVisible: ${CATEGORY_LABEL}
- tapOn: "All"
- assertNotVisible: ${CATEGORY_LABEL}
- back
