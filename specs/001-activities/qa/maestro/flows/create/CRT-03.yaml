# CRT-03 — Toggle order in Arabic: Visit at the start (right) (P1)
# Req: BR §5.3. Run with the app in Arabic (switch the language on the login
# screen first, then log in).
# synced: CL-10
appId: ${APP_ID}
tags: [CRT-03, P1, create, l10n, arabic]
---
- runFlow: ../../subflows/open_dashboard.yaml
- tapOn:
    id: "activities_add_button"
- extendedWaitUntil:
    visible:
      id: "activity_create_type_visit"
    timeout: 20000
- assertVisible:
    id: "activity_create_type_visit"
    rightOf:
      id: "activity_create_type_task"
- back
